lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: UNSPECIFIED
  ignore: []
  except: []
  allow_comment_ignores: false
  ignore_only: {}
deps:
generate:
  inputs:
    - directory: plainjson
    - directory: example/spec
    - directory: example/bench
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - path: ./bin/protoc-gen-go-plainjson
      out: .
      opts:
        paths: source_relative
breaking:
  ignore: []
  against_git_ref: master
